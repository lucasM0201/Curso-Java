<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" th:fragment="main-layout(title, content)">
  <head>
    <meta charset="utf-8">
    <meta name="author" content="Alex Machado Ribeiro">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}"></title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link th:href="@{/css/estilo.css}" rel="stylesheet" type="text/css" media="all">
    <link th:href="@{/img/favicon.png}" rel="icon" type="image/png">
  </head>
  <body>
    
    <header th:replace="~{fragments/header :: header}"></header>
    
    <div class="container mt-5">
        <div th:replace="${content}"></div>
    </div>
    
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
