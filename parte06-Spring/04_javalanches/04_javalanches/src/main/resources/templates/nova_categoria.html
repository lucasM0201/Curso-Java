<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: main-layout(~{::title}, ~{::main})}">

<head>
    <title>Java Lanches - Nova Categoria</title>
</head>

<body>

    <main>

        <h1>Cadastro de nova categoria</h1>

        <hr>

        <form method="POST">

            <div class="row">

                <div class="col-12 mb-3">

                    <label for="novaCategoria" class="form-label">
                        Categoria:
                    </label>

                    <input type="text" class="form-control" placeholder="Informe aqui a categoria do produto"
                        id="nomeCategoria" name="novaCategoria" required>

                </div>

                <div class="d-flex justify-content-start">

                    <button type="submit" class="btn btn-primary">

                        Cadastrar categoria

                    </button>

                </div>

            </div>

        </form>

    </main>

</body>

</html>
